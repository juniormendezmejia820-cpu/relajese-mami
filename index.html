<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Relájese Mami | Gana tu Camiseta</title>
    <style>
        :root { 
            --verde-vuala: #25d366; 
            --verde-brillante: #2ef77a;
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #000;
            overflow: hidden;
        }

        .fondo-pagina {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1;
            filter: brightness(0.5); 
        }

        .capa-overlay {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
        }

        .casino-container { 
            background: rgba(15, 15, 15, 0.8); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 25px; 
            border: 2px solid var(--verde-vuala); 
            border-radius: 40px; 
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.2); 
            text-align: center; 
            width: 85%; max-width: 380px; 
        }

        .titulo-moda {
            color: white;
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .btn { 
            display: block; width: 100%; padding: 18px; 
            border-radius: 50px; 
            font-weight: bold; font-size: 1.1rem; 
            border: none; cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-girar { 
            background: linear-gradient(180deg, var(--verde-brillante) 0%, var(--verde-vuala) 100%);
            color: white; 
            box-shadow: 0 6px 0 #128c7e;
        }
        
        .btn-girar:active { transform: translateY(4px); box-shadow: 0 2px 0 #128c7e; }

        .slot-box { 
            display: flex; justify-content: center; gap: 10px; 
            background: #000; padding: 15px; border-radius: 25px; 
            margin: 20px 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .slot { width: 80px; height: 80px; background: #fff; border-radius: 15px; overflow: hidden; }
        .reel img { width: 80px; height: 80px; display: block; object-fit: cover; }
        .spinning { filter: blur(3px); }

        #mensaje { color: var(--verde-brillante); font-weight: bold; margin-top: 15px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <iframe src="estudio.html" class="fondo-pagina" id="miEstudio"></iframe>

    <div class="capa-overlay">
        <div class="casino-container">
            <h2 class="titulo-moda">🎰 ¡PRUEBA TU SUERTE! 🎰</h2>
            
            <div class="slot-box">
                <div class="slot"><div class="reel" id="r1"></div></div>
                <div class="slot"><div class="reel" id="r2"></div></div>
                <div class="slot"><div class="reel" id="r3"></div></div>
            </div>

            <p style="color:white; font-size: 0.9rem;">Intentos: <span id="intentos" style="color:var(--verde-brillante);">3</span>/3</p>
            
            <button id="btnSpin" onclick="lanzarSuerte()" class="btn btn-girar">¡GIRAR AHORA!</button>
            <p id="mensaje"></p>
            
            <button onclick="cerrarCasino()" id="btnEntrar" class="btn btn-girar" style="display: none; margin-top: 20px;">
                🎨 DISEÑAR MI CAMISETA
            </button>
        </div>
    </div>

    <script>
        const figuras = ['100.png', '101.png', '102.png']; 
        let intentosRestantes = 3;

        // Sorteo de sesión
        const azar = Math.floor(Math.random() * 100) + 1;
        let premioAsignado = null; 

        if (azar <= 5) premioAsignado = 2; // 102.png
        else if (azar <= 15) premioAsignado = 1; // 101.png
        else if (azar <= 30) premioAsignado = 0; // 100.png

        function cargarReel(id, fFinal = null) {
            const r = document.getElementById('r' + id);
            let contenido = '';
            for (let i = 0; i < 20; i++) contenido += `<img src="${figuras[Math.floor(Math.random() * 3)]}">`;
            let f = fFinal !== null ? fFinal : Math.floor(Math.random() * 3);
            contenido += `<img src="${figuras[f]}">`;
            r.innerHTML = contenido;
            return f;
        }
        cargarReel(1); cargarReel(2); cargarReel(3);

        function lanzarSuerte() {
            if (intentosRestantes <= 0) return;
            intentosRestantes--;
            document.getElementById('intentos').innerText = intentosRestantes;
            document.getElementById('btnSpin').disabled = true;

            let res = [];
            if (premioAsignado !== null && intentosRestantes === 0) {
                res = [premioAsignado, premioAsignado, premioAsignado];
            } else {
                res = [0, 1, 2].sort(() => Math.random() - 0.5);
            }
            
            [1, 2, 3].forEach((id, i) => {
                const r = document.getElementById('r' + id);
                r.style.transition = 'none';
                r.style.transform = 'translateY(0)';
                cargarReel(id, res[i]);
                void r.offsetWidth; 
                const t = 2 + (i * 0.5);
                r.style.transition = `transform ${t}s cubic-bezier(0.1, 0, 0.1, 1)`;
                r.classList.add('spinning');
                r.style.transform = `translateY(-${20 * 80}px)`;
                
                setTimeout(() => {
                    r.classList.remove('spinning');
                    if (i === 2) verificarPremio(res);
                }, t * 1000);
            });
        }

        function verificarPremio(res) {
            const m = document.getElementById('mensaje');
            const btn = document.getElementById('btnSpin');
            const btnFinal = document.getElementById('btnEntrar');

            if (res[0] === res[1] && res[1] === res[2]) {
                m.innerHTML = "🏆 ¡BRUTAL! <br> GANASTE UN PREMIO";
                btn.style.display = 'none';
                btnFinal.style.display = 'block';
            } else if (intentosRestantes > 0) {
                btn.disabled = false;
                m.innerText = "¡Casi! Te queda otra oportunidad.";
            } else {
                m.innerText = "¡Crea tu diseño ahora!";
                btn.style.display = 'none';
                btnFinal.style.display = 'block';
            }
        }

        function cerrarCasino() {
            document.querySelector('.capa-overlay').style.display = 'none';
            document.getElementById('miEstudio').style.filter = 'none';
        }
    </script>
</body>
</html>
