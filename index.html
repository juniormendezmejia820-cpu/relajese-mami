<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RELÁJESE MAMI | Studio Profesional</title>
    <style>
        :root { --verde: #25d366; --negro-puro: #000; --gris-oscuro: #1a1a1a; --gris-claro: #333; --amarillo: #ffcc00; }
        
        html, body { 
            margin: 0; background: var(--negro-puro); color: white; 
            font-family: 'Arial Black', sans-serif; 
            overflow-x: hidden; width: 100%; touch-action: manipulation;
        }
        
        #punto-subida { width: 100%; height: 5px; }

        .portada { 
            width: 100%; height: 180px; 
            background: url('portada.jpg') #1a1a1a; 
            background-size: cover; background-position: center;
            border-bottom: 5px solid var(--verde);
        }

        .contenedor-principal { 
            display: flex; gap: 15px; padding: 15px; 
            justify-content: center; flex-wrap: wrap; 
            width: 100%; max-width: 1200px; box-sizing: border-box; margin: auto;
        }

        .visor-estudio { 
            position: relative; width: 95vw; height: 95vw; 
            max-width: 420px; max-height: 420px;
            background: #111; border-radius: 25px; border: 1px solid #333;
            display: flex; justify-content: center; align-items: center; 
            overflow: hidden; touch-action: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #camiseta-fondo { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .logo-marca-fijo { position: absolute; width: 12%; top: 32%; left: 23%; z-index: 5; pointer-events: none; }
        
        #arte-cliente { 
            position: absolute; width: 140px; z-index: 10; 
            cursor: move; top: 40%; left: 40%; touch-action: none; 
        }
        #img-personalizada { width: 100%; display: block; pointer-events: none; }

        .controles { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 12px; }
        .tarjeta { background: var(--gris-oscuro); padding: 15px; border-radius: 20px; border: 1px solid #333; }
        
        .grid-colores { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
            padding: 5px; background: #000; border-radius: 15px;
        }
        .circulo { width: 38px; height: 38px; border-radius: 50%; cursor: pointer; border: 2px solid #333; transition: 0.2s; margin: auto; }
        .circulo:hover { transform: scale(1.1); border-color: white; }

        .btn-coleccion {
            background: var(--gris-claro); color: white; padding: 18px; border-radius: 20px;
            font-weight: bold; font-size: 14px; border: 2px solid #555; cursor: pointer;
            width: 100%; margin-top: 10px; text-transform: uppercase;
            box-shadow: 0 0 10px rgba(37, 211, 102, 0.2);
        }

        .btn-whatsapp { 
            background: var(--verde); color: white; padding: 18px; 
            border-radius: 15px; font-weight: bold; font-size: 16px; 
            text-decoration: none; display: flex; align-items: center; 
            justify-content: center; gap: 10px; text-transform: uppercase;
        }

        .galeria-artes { width: 100%; padding: 20px; text-align: center; border-top: 1px solid #222; box-sizing: border-box; }
        .grid-artes { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; padding: 15px 0; max-width: 1000px; margin: 0 auto; }
        
        .caja-arte { 
            aspect-ratio: 1/1; background: #1a1a1a; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            border: 1px solid #333; cursor: pointer; overflow: hidden;
        }
        .caja-arte.activo { border: 3px solid var(--verde); transform: scale(1.05); }
        .caja-arte img { max-width: 80%; max-height: 80%; object-fit: contain; }

        /* MODAL DE FOTOS ENTREGADAS */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.95); }
        .cerrar-modal { position: absolute; top: 20px; right: 20px; color: white; font-size: 40px; font-weight: bold; cursor: pointer; z-index: 1010; }
        .slider-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .slider-wrapper { display: flex; height: 100%; width: 100%; transition: transform 0.4s ease-out; }
        .slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .slide img { max-width: 90%; max-height: 80vh; border-radius: 15px; border: 2px solid var(--verde); }
    </style>
</head>
<body>

    <div class="portada"></div>
    <div id="punto-subida"></div>

    <div class="contenedor-principal">
        <div class="visor-estudio" id="espacio-trabajo">
            <img src="camiseta-base.jpg" id="camiseta-fondo">
            <img src="logo-mami.png" class="logo-marca-fijo">
            <div id="arte-cliente">
                <img src="102.png" id="img-personalizada">
            </div>
        </div>

        <div class="controles">
            <div class="tarjeta">
                <p style="text-align:center; color:var(--verde); margin:0 0 10px 0; font-size: 13px;">COLOR DE PRENDA</p>
                <div class="grid-colores">
                    <div class="circulo" style="background:#ffffff;" onclick="pintar('none')"></div>
                    <div class="circulo" style="background:#000000;" onclick="pintar('brightness(0.1)')"></div>
                    <div class="circulo" style="background:#ff0000;" onclick="pintar('brightness(0.5) sepia(1) hue-rotate(-50deg) saturate(10)')"></div>
                    <div class="circulo" style="background:#00008b;" onclick="pintar('brightness(0.3) sepia(1) hue-rotate(190deg) saturate(8)')"></div>
                    <div class="circulo" style="background:#00ff00;" onclick="pintar('brightness(0.6) sepia(1) hue-rotate(80deg) saturate(10)')"></div>
                </div>
                <button class="btn-coleccion" onclick="abrirModal()">📷 TRABAJOS ENTREGADOS</button>
            </div>
            
            <a href="https://wa.me/573012134377" target="_blank" class="btn-whatsapp">📱 PEDIR A RELÁJESE MAMI</a>
        </div>
    </div>

    <div class="galeria-artes">
        <h3 style="color:var(--verde);">🎨 ELIGE TU DISEÑO</h3>
        <div class="grid-artes" id="galeria-disenos"></div>
    </div>

    <div id="modalColeccion" class="modal">
        <span class="cerrar-modal" onclick="cerrarModal()">&times;</span>
        <div class="slider-container">
            <div class="slider-wrapper" id="sliderWrapper"></div>
        </div>
    </div>

    <script>
        function pintar(f) { document.getElementById('camiseta-fondo').style.filter = f; }
        
        // Diseños actualizados 100, 101, 102
        const misDisenos = ['100.png', '101.png', '102.png']; 
        const contenedorGaleria = document.getElementById('galeria-disenos');
        
        misDisenos.forEach(a => {
            const caja = document.createElement('div');
            caja.className = "caja-arte";
            caja.id = `btn-${a}`;
            caja.onclick = () => cambiarArte(a);
            caja.innerHTML = `<img src="${a}">`;
            contenedorGaleria.appendChild(caja);
        });

        function cambiarArte(src) { 
            document.getElementById('img-personalizada').src = src; 
            document.querySelectorAll('.caja-arte').forEach(c => c.classList.remove('activo'));
            document.getElementById('btn-' + src).classList.add('activo');
        }

        // FOTOS DE TRABAJOS ENTREGADOS (Solo aparecen estas fotos)
        const fotosEntregadas = ['foto1.png', 'foto2.png', 'foto3.png']; 
        const wrapper = document.getElementById('sliderWrapper');
        
        fotosEntregadas.forEach(foto => {
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.innerHTML = `<img src="entregas/${foto}">`; // YA NO TIENE EL LOGO DE RESPALDO
            wrapper.appendChild(slide);
        });

        function abrirModal() { document.getElementById('modalColeccion').style.display = "block"; }
        function cerrarModal() { document.getElementById('modalColeccion').style.display = "none"; }

        // Lógica de arrastrar (Drag and drop)
        const arte = document.getElementById('arte-cliente');
        const visor = document.getElementById('espacio-trabajo');
        let drag = false;
        function mover(x, y) {
            if(!drag) return;
            const r = visor.getBoundingClientRect();
            arte.style.left = (x - r.left - (arte.offsetWidth / 2)) + 'px';
            arte.style.top = (y - r.top - (arte.offsetHeight / 2)) + 'px';
        }
        arte.onmousedown = () => drag = true;
        window.onmouseup = () => drag = false;
        window.onmousemove = (e) => mover(e.clientX, e.clientY);
        arte.ontouchstart = () => drag = true;
        window.ontouchend = () => drag = false;
        window.ontouchmove = (e) => { if(drag) mover(e.touches[0].clientX, e.touches[0].clientY); };
    </script>
</body>
</html>
