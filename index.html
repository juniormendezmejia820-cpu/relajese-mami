<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RELÁJESE MAMI | Gana tu Premio</title>
    <style>
        :root { 
            --verde-vuala: #25d366; 
            --verde-brillante: #2ef77a;
            --amarillo: #ffcc00;
        }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Arial Black', sans-serif; 
            background-color: #000;
            overflow: hidden;
        }

        .fondo-pagina {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; z-index: 1;
            filter: brightness(0.3); 
        }

        .capa-overlay {
            position: relative; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
        }

        .casino-container { 
            background: rgba(15, 15, 15, 0.9); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 30px 20px; 
            border: 2px solid var(--amarillo); 
            border-radius: 40px; 
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.2); 
            text-align: center; 
            width: 85%; max-width: 380px; 
        }

        .titulo-moda {
            color: var(--amarillo);
            font-size: 1.2rem;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .input-codigo {
            width: 80%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--amarillo);
            background: #000;
            color: white;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .btn { 
            display: block; width: 100%; padding: 18px; 
            border-radius: 50px; 
            font-weight: bold; font-size: 1.1rem; 
            border: none; cursor: pointer; 
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-girar { 
            background: linear-gradient(180deg, var(--amarillo) 0%, #ccaa00 100%);
            color: black; 
            box-shadow: 0 6px 0 #886600;
        }
        
        .btn-girar:active { transform: translateY(4px); box-shadow: 0 2px 0 #886600; }
        .btn-girar:disabled { background: #555; box-shadow: none; color: #888; cursor: not-allowed; }

        .slot-box { 
            display: flex; justify-content: center; gap: 10px; 
            background: #000; padding: 15px; border-radius: 25px; 
            margin: 20px 0; border: 1px solid rgba(255,255,255,0.1);
        }
        .slot { width: 80px; height: 80px; background: #fff; border-radius: 15px; overflow: hidden; }
        .reel img { width: 80px; height: 80px; display: block; object-fit: cover; }
        .spinning { filter: blur(3px); }

        #mensaje { color: white; font-weight: bold; margin-top: 15px; font-size: 1rem; line-height: 1.4; }
    </style>
</head>
<body>

    <iframe src="estudio.html" class="fondo-pagina" id="miEstudio"></iframe>

    <div class="capa-overlay">
        <div class="casino-container">
            <h2 class="titulo-moda">🎰 CASINO RELÁJESE MAMI 🎰</h2>
            
            <div id="seccion-codigo">
                <p style="color:white; font-size: 0.8rem; margin-bottom: 10px;">Introduce tu código para participar</p>
                <input type="text" id="codigoUsuario" class="input-codigo" placeholder="Escribe aquí...">
                <button onclick="validarCodigo()" class="btn btn-girar">Validar Código</button>
            </div>

            <div id="seccion-juego" style="display: none;">
                <div class="slot-box">
                    <div class="slot"><div class="reel" id="r1"></div></div>
                    <div class="slot"><div class="reel" id="r2"></div></div>
                    <div class="slot"><div class="reel" id="r3"></div></div>
                </div>

                <p style="color:white; font-size: 0.9rem;">Intentos: <span id="intentos" style="color:var(--amarillo);">3</span>/3</p>
                
                <button id="btnSpin" onclick="lanzarSuerte()" class="btn btn-girar">¡GIRAR AHORA!</button>
            </div>

            <p id="mensaje"></p>
            
            <button onclick="cerrarCasino()" id="btnEntrar" class="btn btn-girar" style="display: none; margin-top: 20px;">
                🎨 DISEÑAR MI CAMISETA
            </button>
        </div>
    </div>

    <script>
        // Imágenes: 1.png (Domicilio), 2.png (20% Desc), 3.png (Camiseta)
        const figuras = ['1.png', '2.png', '3.png']; 
        let intentosRestantes = 3;
        let codigoValido = false;

        // Probabilidad: Camiseta (1%), 20% Desc (10%), Domicilio (15%)
        const azar = Math.floor(Math.random() * 100) + 1;
        let premioAsignado = null; // 2: Camiseta, 1: 20%, 0: Domicilio

        if (azar <= 1) premioAsignado = 2;
        else if (azar <= 11) premioAsignado = 1;
        else if (azar <= 26) premioAsignado = 0;

        function validarCodigo() {
            const cod = document.getElementById('codigoUsuario').value.toLowerCase();
            // Acepta códigos desde m000r hasta m1000r
            const regex = /^m([0-9]{1,3}|1000)r$/;
            
            if (regex.test(cod) || cod === 'm005r') {
                document.getElementById('seccion-codigo').style.display = 'none';
                document.getElementById('seccion-juego').style.display = 'block';
                document.getElementById('mensaje').innerText = "¡Código aceptado! Tienes 3 intentos.";
                cargarReel(1); cargarReel(2); cargarReel(3);
            } else {
                alert("Código no válido. Por favor, verifica tu compra.");
            }
        }

        function cargarReel(id, fFinal = null) {
            const r = document.getElementById('r' + id);
            let contenido = '';
            for (let i = 0; i < 20; i++) contenido += `<img src="${figuras[Math.floor(Math.random() * 3)]}">`;
            let f = fFinal !== null ? fFinal : Math.floor(Math.random() * 3);
            contenido += `<img src="${figuras[f]}">`;
            r.innerHTML = contenido;
            return f;
        }

        function lanzarSuerte() {
            if (intentosRestantes <= 0) return;
            intentosRestantes--;
            document.getElementById('intentos').innerText = intentosRestantes;
            document.getElementById('btnSpin').disabled = true;
            document.getElementById('mensaje').innerText = "¡Girando...";

            let res = [];
            // Si tiene premio y es el último intento, gana. Si no, sale random.
            if (premioAsignado !== null && intentosRestantes === 0) {
                res = [premioAsignado, premioAsignado, premioAsignado];
            } else {
                res = [0, 1, 2].sort(() => Math.random() - 0.5);
            }
            
            [1, 2, 3].forEach((id, i) => {
                const r = document.getElementById('r' + id);
                r.style.transition = 'none';
                r.style.transform = 'translateY(0)';
                cargarReel(id, res[i]);
                void r.offsetWidth; 
                const t = 2 + (i * 0.5);
                r.style.transition = `transform ${t}s cubic-bezier(0.1, 0, 0.1, 1)`;
                r.classList.add('spinning');
                r.style.transform = `translateY(-${20 * 80}px)`;
                
                setTimeout(() => {
                    r.classList.remove('spinning');
                    if (i === 2) verificarPremio(res);
                }, t * 1000);
            });
        }

        function verificarPremio(res) {
            const m = document.getElementById('mensaje');
            const btn = document.getElementById('btnSpin');
            const btnFinal = document.getElementById('btnEntrar');

            if (res[0] === res[1] && res[1] === res[2]) {
                const premiosTexto = ["¡DOMICILIO GRATIS!", "¡20% DE DESCUENTO!", "¡LA CAMISETA ES TUYA!"];
                m.innerHTML = `<span style="color:var(--amarillo)">🏆 ¡BRUTAL! 🏆</span><br>${premiosTexto[res[0]]}`;
                btn.style.display = 'none';
                btnFinal.style.display = 'block';
            } else if (intentosRestantes > 0) {
                btn.disabled = false;
                m.innerText = "¡Casi! Te queda otra oportunidad.";
            } else {
                m.innerHTML = "No hubo suerte esta vez...<br>¡Pero crea tu diseño ahora!";
                btn.style.display = 'none';
                btnFinal.style.display = 'block';
            }
        }

        function cerrarCasino() {
            document.querySelector('.capa-overlay').style.display = 'none';
            document.getElementById('miEstudio').style.filter = 'none';
        }
    </script>
</body>
</html>
