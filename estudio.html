<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vualá | Studio Profesional</title>
    <style>
        :root { --verde: #25d366; --negro: #000; --gris: #1a1a1a; }
        
        body, html { 
            margin: 0; background: var(--negro); color: white; 
            font-family: 'Arial Black', sans-serif; 
            text-align: center; overflow-x: hidden;
        }

        /* VISOR DE DISEÑO */
        .visor-estudio { 
            position: relative; width: 340px; height: 340px; 
            background: #111; margin: 20px auto; border-radius: 20px; 
            border: 2px solid var(--verde); overflow: hidden; touch-action: none;
        }
        #camiseta-fondo { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        #arte-cliente { 
            position: absolute; width: 120px; top: 35%; left: 35%; 
            z-index: 10; cursor: move; 
        }
        #img-personalizada { width: 100%; pointer-events: none; }

        /* BOTONES */
        .controles { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .btn-accion { 
            background: var(--verde); color: white; padding: 18px; 
            border-radius: 15px; font-weight: bold; width: 340px; 
            border: none; cursor: pointer; text-transform: uppercase;
        }
        .btn-wa { background: #128c7e; text-decoration: none; color: white; display: block; width: 340px; padding: 18px; border-radius: 15px; font-weight: bold; }

        /* MODAL DE ENTREGAS */
        .modal { 
            display: none; position: fixed; z-index: 1000; 
            left: 0; top: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); justify-content: center; align-items: center; 
        }
        .cerrar { position: absolute; top: 20px; right: 30px; font-size: 40px; color: white; cursor: pointer; }
        .foto-entregada { max-width: 85%; max-height: 80vh; border: 3px solid var(--verde); border-radius: 15px; }
    </style>
</head>
<body>

    <div class="visor-estudio" id="espacio">
        <img src="camiseta-base.jpg" id="camiseta-fondo">
        <div id="arte-cliente">
            <img src="102.png" id="img-personalizada">
        </div>
    </div>

    <div class="controles">
        <button class="btn-accion" onclick="abrirEntregas()">📷 TRABAJOS ENTREGADOS</button>
        <a href="https://wa.me/573012134377" class="btn-wa">📱 PEDIR POR WHATSAPP</a>
    </div>

    <div id="modalEntregas" class="modal">
        <span class="cerrar" onclick="cerrarEntregas()">&times;</span>
        <div id="visorFotos">
            </div>
    </div>

    <script>
        // Función para identificar la carpeta entregas y la foto1.png
        function abrirEntregas() {
            const visor = document.getElementById('visorFotos');
            // Configuramos la ruta exacta que pediste
            visor.innerHTML = `<img src="entregas/foto1.png" class="foto-entregada" alt="Entrega Vualá">`;
            document.getElementById('modalEntregas').style.display = "flex";
        }

        function cerrarEntregas() {
            document.getElementById('modalEntregas').style.display = "none";
        }

        // Lógica de movimiento para el diseño
        const arte = document.getElementById('arte-cliente');
        let moviendo = false, offsetX = 0, offsetY = 0;

        arte.addEventListener('touchstart', (e) => {
            moviendo = true;
            const touch = e.touches[0];
            offsetX = touch.clientX - arte.offsetLeft;
            offsetY = touch.clientY - arte.offsetTop;
        });

        document.addEventListener('touchmove', (e) => {
            if (!moviendo) return;
            const touch = e.touches[0];
            arte.style.left = (touch.clientX - offsetX) + 'px';
            arte.style.top = (touch.clientY - offsetY) + 'px';
        });

        document.addEventListener('touchend', () => { moviendo = false; });
    </script>
</body>
</html>
